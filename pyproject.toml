[project]
name = "FullBacktester"
version = "0.1.0"
description = "Backtesting engine with built-in defenses against look-ahead bias, survivorship bias, and overfitting: point-in-time data access, dual cross-checked engines, leakage scanners, and deflated performance statistics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vivaan Jain" }]
keywords = ["backtesting", "quant", "trading", "finance", "look-ahead-bias", "overfitting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]
nse = ["requests>=2.31"]
calendars = ["exchange_calendars>=4.5"]
all = ["yfinance>=0.2.40", "requests>=2.31", "exchange_calendars>=4.5"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.urls]
Repository = "https://github.com/vj0246/Backtesting-Framework"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fullbacktester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:fullbacktester.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal data rows (exchange CSV headers) are clearer unbroken

[tool.mypy]
# 3.12 target: numpy's stubs use PEP 695 syntax mypy only accepts at >= 3.12.
# The code itself stays 3.11-compatible (no `type` statements, no 3.12-only APIs).
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/fullbacktester"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*", "pyarrow.*", "platformdirs.*", "requests.*"]
ignore_missing_imports = true
