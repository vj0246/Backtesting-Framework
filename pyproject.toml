[project]
name = "ubt"  # placeholder — rename before publishing
version = "0.0.1"
description = "Universal backtester: dual-engine execution with built-in leakage, overfitting, and implementation-risk scoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubt"]
